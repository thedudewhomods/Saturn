name: Build Android Saturn APK (Legacy Branch Only)

on:
  push:
    branches: [ "legacy" ]
  pull_request:
    branches: [ "legacy" ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository source code
      uses: actions/checkout@v4
      with:
        ref: 'legacy'

    - name: Set up Java Development Kit env
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # STEP MOVED HERE: Executes first to install dependencies and apply code patches
    - name: Run Pipeline File Engine Patches & Install Host Dependencies
      run: |
        python3 generate_pipeline.py

    # STEP MOVED HERE: Executes right after your pipeline file operations complete
    - name: Configure Android SDK and NDK Environments Manually
      run: |
        echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
        NDK_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -n 1)
        echo "NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
        echo "PATH=$NDK_PATH:/usr/local/lib/android/sdk/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV

    - name: Check and Secure Workspace Asset Baseline
      run: |
        if [ ! -f "baserom.us.z64" ]; then
          echo "[*] Forging dummy asset file to enable standard asset compilation loop..."
          dd if=/dev/zero of=baserom.us.z64 bs=1M count=8
        fi

    - name: Compile Native Shared Libraries via Android NDK Build Hooks
      run: |
        make TARGET_ANDROID=1 -j4
        
        # Route compiled asset assets out of the customized us_mobile pipeline down into gradle wrapper resources
        if [ -d "build/us_mobile/res" ]; then
          cp -r build/us_mobile/res android_wrapper/app/src/main/assets/
        elif [ -d "build/us_pc/res" ]; then
          cp -r build/us_pc/res android_wrapper/app/src/main/assets/
        fi

    - name: Run Gradle Wrapper Package Framework Assembly
      run: |
        cd android_wrapper
        gradle wrapper
        ./gradlew assembleDebug

    - name: Export Working Signed Android Binary APK
      uses: actions/upload-artifact@v4
      with:
        name: saturn-android-ready-apk
        path: android_wrapper/app/build/outputs/apk/debug/app-debug.apk
