name: Build Saturn Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'scripts/port_to_android.py'
      - 'src/**'
      - '.github/workflows/compile.yml'

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Saturn
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Install Android SDK packages
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found under $ANDROID_HOME/cmdline-tools"
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager -print || true
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

      - name: Decode personal base ROM
        env:
          BASEROM_BASE64: ${{ secrets.BASEROM_BASE64 }}
        run: |
          if [ -z "$BASEROM_BASE64" ]; then
            echo "::error::Set BASEROM_BASE64 to your own legally obtained US ROM dump, base64 encoded."
            exit 1
          fi
          printf '%s' "$BASEROM_BASE64" | base64 --decode > baserom.us.z64
          test -s baserom.us.z64

      - name: Prepare SDL2 and game assets
        run: python3 scripts/port_to_android.py

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p android :app:assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Saturn-Android-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Saturn-Android-build-diagnostics
          path: |
            android/app/build/reports/
            android/app/.cxx/
            android/SDL/
          if-no-files-found: warn
