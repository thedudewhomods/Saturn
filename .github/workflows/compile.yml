name: AI Android Port & APK Builder (Saturn + CoopDX Touch)

on:
  workflow_dispatch:
    inputs:
      ai_provider:
        description: 'AI Engine ("api" for OpenAI/OpenRouter/DeepSeek or "local" for Ollama Qwen-Coder)'
        required: true
        default: 'api'
        type: choice
        options:
          - api
          - local
      ai_model:
        description: 'Model name (e.g., gpt-4o, claude-3-5-sonnet, or qwen2.5-coder:7b)'
        required: true
        default: 'gpt-4o'
      max_fix_loops:
        description: 'Max compiler error auto-fix retries'
        required: true
        default: '8'

jobs:
  ai-port-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout SM64 Saturn Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK, CMake & Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-pip python3-dev libsdl2-dev libglew-dev git curl unzip
          sdkmanager --install "ndk;25.2.9519653" "cmake;3.22.1" "platforms;android-33" "build-tools;33.0.2"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Decode Base ROM from GitHub Secrets
        env:
          BASEROM_BASE64: ${{ secrets.BASEROM_BASE64 }}
        run: |
          if [ -z "$BASEROM_BASE64" ]; then
            echo "ERROR: BASEROM_BASE64 secret is missing!"
            exit 1
          fi
          echo "$BASEROM_BASE64" | base64 --decode > baserom.us.z64
          ls -lh baserom.us.z64

      - name: Clone Android CoopDX Reference (for Gradle & Touch Controls)
        run: |
          git clone --depth 1 https://github.com /tmp/coopdx-ref || \
          git clone --depth 1 https://github.com /tmp/coopdx-ref

      - name: Setup AI Environment (Local Ollama or API Client)
        run: |
          pip install requests openai
          if [ "${{ github.event.inputs.ai_provider }}" == "local" ]; then
            curl -fsSL https://ollama.com | sh
            ollama serve &
            sleep 5
            ollama pull ${{ github.event.inputs.ai_model }}
          fi

      - name: Run AI Porting, Kotlin Wrapper & Self-Healing Build Loop
        env:
          AI_PROVIDER: ${{ github.event.inputs.ai_provider }}
          AI_MODEL: ${{ github.event.inputs.ai_model }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          MAX_LOOPS: ${{ github.event.inputs.max_fix_loops }}
        run: |
          python3 scripts/port_to_android.py

      - name: Upload Built APK (If Successful)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SM64-Saturn-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload Ported Source & Logs (For Debugging if Build Fails)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Saturn-AI-Port-Debug-Bundle
          path: |
            android/
            build_errors.log
